<style>
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #efede8;
  --text: #1d1d1b;
  --muted: #6b6a66;
  --line: #e3e0d9;
  --accent: #2f5d50;
  --accent-ink: #ffffff;
  --accent-soft: #dfeae5;
  --warn: #a5560b;
  --warn-soft: #fbeedd;
  --ok: #2b6b3f;
  --ok-soft: #e0f0e4;
  --danger: #b3261e;
  --radius: 14px;
  --tab-h: 58px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --surface: #1d1d1c; --surface-2: #272725; --text: #efeee9; --muted: #a09e98;
    --line: #33322f; --accent: #7cc0a8; --accent-ink: #0f1f1a; --accent-soft: #1f3530;
    --warn: #f0b46a; --warn-soft: #3a2a17; --ok: #8fd0a2; --ok-soft: #1c3324; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --surface: #1d1d1c; --surface-2: #272725; --text: #efeee9; --muted: #a09e98;
  --line: #33322f; --accent: #7cc0a8; --accent-ink: #0f1f1a; --accent-soft: #1f3530;
  --warn: #f0b46a; --warn-soft: #3a2a17; --ok: #8fd0a2; --ok-soft: #1c3324; --danger: #ff8a80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body.noscroll { overflow: hidden; }
a { color: var(--accent); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

#app {
  max-width: 640px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 8px) 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px);
}

/* ---- header ---- */
.top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; min-height: 48px; margin-bottom: 4px; }
.top h1 { font-size: 17px; text-align: center; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back { font-size: 34px; line-height: 1; padding: 0 8px 4px 0; }
.hero { padding: 12px 0 4px; }
.hero h1 { font-size: 28px; margin: 0; letter-spacing: .02em; }
.goal { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

section { margin-top: 22px; }
h2 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; }
h2 .more { margin-left: auto; font-size: 14px; font-weight: 500; }
h2 .count { font-weight: 500; }
.lead { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }
.sub { color: var(--muted); font-size: 13px; line-height: 1.45; }
.muted { color: var(--muted); }
.strike { text-decoration: line-through; }
.center { text-align: center; }
.right { text-align: right; flex-shrink: 0; }
.small { font-size: 13px; }

/* ---- cards & lists ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 10px 0; }
.card strong { display: block; }
.card p { margin: 8px 0 0; }
.intro { border-color: var(--accent); background: var(--accent-soft); }
.viewpoint strong { font-size: 18px; margin-top: 2px; }
.notice { background: var(--warn-soft); color: var(--text); border-left: 4px solid var(--warn); padding: 10px 12px; border-radius: 8px; font-size: 14px; margin: 12px 0; }
.empty { color: var(--muted); font-size: 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 18px 14px; text-align: center; }

.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.list > li + li { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; color: var(--text); min-height: 52px; width: 100%; }
li.row { padding: 10px 14px; }
.row.plain, .plain { background: none; border: 0; text-align: left; padding: 12px 14px; }
.plain.left { padding: 0; }
.grow { flex: 1; min-width: 0; }
.ico { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
.ico.big { font-size: 26px; width: auto; }
.chev { color: var(--muted); font-size: 22px; }
.list.compact .row { min-height: 40px; }

.check {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface);
  flex-shrink: 0; display: grid; place-items: center; font-size: 15px; color: var(--accent-ink); padding: 0;
}
.check.on { background: var(--accent); border-color: var(--accent); }

.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 6px 0; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }

.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); vertical-align: 1px; white-space: nowrap; }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }

/* ---- grid of categories ---- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; color: var(--text); display: flex; flex-direction: column; gap: 4px; position: relative; min-height: 128px; }
.tile.important { border-color: var(--accent); }
.tile strong { font-size: 14px; line-height: 1.35; }
.tile .no { position: absolute; top: 10px; right: 12px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tile .bar { margin-top: auto; }

/* ---- chips / buttons ---- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.item-row .chips { padding: 0 14px 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: 13px; color: var(--muted); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.actions { display: flex; gap: 8px; margin-top: 12px; }
.actions.wrap { flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 600; min-height: 40px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.danger { color: var(--danger); }
.btn.full { width: 100%; margin-top: 16px; }
.link { background: none; border: 0; color: var(--accent); padding: 4px 0; }
.link.strong { font-weight: 700; }

.suggest .title { display: block; font-weight: 700; font-size: 16px; color: var(--text); margin-top: 2px; }
.suggest .reason { color: var(--muted); font-size: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 0; }
.meta dt { font-size: 11px; color: var(--muted); }
.meta dd { margin: 0; font-size: 13px; font-weight: 600; }
.stats div { min-width: 28%; }

.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; margin: 4px 0 12px; }
.seg a { flex: 1; text-align: center; padding: 7px 4px; border-radius: 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
.seg a.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 16px; }

/* ---- article ---- */
.article h1 { font-size: 22px; line-height: 1.4; margin: 8px 0 4px; }
.article h2 { color: var(--text); font-size: 16px; margin-top: 22px; }
.article p { margin: 6px 0; }
.basis { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.b-official, .b-science { background: var(--ok-soft); color: var(--ok); }

.photo { width: 120px; height: 120px; object-fit: cover; border-radius: 12px; }

/* ---- tab bar ---- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; justify-content: space-around;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: var(--tab-h); font-size: 11px; color: var(--muted); gap: 1px; }
.tabbar a span { font-size: 21px; filter: grayscale(1); opacity: .65; }
.tabbar a.on { color: var(--accent); font-weight: 700; }
.tabbar a.on span { filter: none; opacity: 1; }

/* ---- bottom sheet ---- */
.sheet { position: fixed; inset: 0; z-index: 30; display: none; }
.sheet.open { display: block; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
.sheet-panel {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column;
  background: var(--bg); border-radius: 18px 18px 0 0; max-width: 640px; margin: 0 auto;
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet-head > :last-child { justify-self: end; }
.sheet-head > :first-child { justify-self: start; }
.sheet-body { overflow-y: auto; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; font-size: 16px; /* iOSの自動ズーム防止 */
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px;
  -webkit-appearance: none; appearance: none;
}
.field input[type="date"], .field input[type="month"] { display: block; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px); transform: translate(-50%, 20px);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: .25s; z-index: 40; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.tile .ico.big { text-align: left; }
.tile .badge { align-self: flex-start; }
.list.compact { margin-top: 10px; }

:root[data-theme="dark"] { --lv1: #ff9d6c; --lv1-soft: #3a2418; --lv2: #7cc0a8; --lv2-soft: #1f3530; --lv3: #c7b3ee; --lv3-soft: #2d2540; }

.ng { border-left: 4px solid var(--lv1); }

.sos-btn { display: block; text-align: center; font-weight: 700; padding: 11px; margin: 10px 0; border-radius: 12px; background: var(--lv1-soft); color: var(--lv1); border: 1px solid var(--lv1); }

 * トラブル対処（SOS）
 * ------------------------------------------------------------
 * 二人でいるとき・出かけた先で予定どおりにいかないときの対処。

 *   id     : 一意のID（自分メモと紐付くので変更しない）

 *   title  : 状況
 *   now    : まずやること（順番どおり）
 *   say    : 言い方の例（そのまま言える一言）

<script>
/* 大人の身だしなみ・生活力向上アプリ — 本体
 * ビルド不要。データはすべてこの端末の localStorage に保存されます。 */
(function () {
  'use strict';

  const D = window.SAITEIGEN_DATA;
  const MAP = window.SAITEIGEN_MAP;
  const ARTICLES = (window.SAITEIGEN_CONTENT || []).filter(a => a.status !== 'archived');
  const STORE_KEY = 'saiteigen.v1';
  const $app = document.getElementById('app');

  // ---------- インデックス ----------
  const itemMap = {};
  const catMap = {};
  D.categories.forEach(c => {
    catMap[c.id] = c;
    c.items.forEach(it => {
      it.cat = c.id;
      it.kind = it.kind || c.kind;
      itemMap[it.id] = it;
    });
  });
  // 【AI仮情報】js/ai-draft/ の下書きから記事を組み立てる。
  // その項目を扱う記事が js/content.js にあれば、そちらを優先し AI仮情報は使わない。
  const covered = new Set(ARTICLES.flatMap(a => a.items || []));
  const AI_DRAFT = window.SAITEIGEN_AI_DRAFT || {};
  Object.keys(AI_DRAFT).forEach(itemId => {
    const it = itemMap[itemId];
    const d = AI_DRAFT[itemId];
    if (!it || covered.has(itemId)) return;
    const one = v => (v ? [{ text: v }] : []);
    ARTICLES.push({
      id: 'ai-' + itemId, title: it.name, items: [itemId], origin: 'ai', status: 'draft', reliability: 'uncertain',
      checkedAt: null, sources: [], history: [],
      sections: {
        what: one(d.s), why: one(d.w), standard: one(d.b),
        howto: (d.h || []).map((x, i) => ({ text: (i + 1) + '. ' + x })),
        tools: one(d.t), frequency: one(d.f), caution: one(d.c), enough: one(d.e)
      }
    });
    it.articles = (it.articles || []).concat('ai-' + itemId);
  });
  // カードは c.origin が無ければ MAP.origin（既定 'ai'）。確認済みにしたら c.origin = 'verified'
  const isAi = x => (x.origin || (x.area ? MAP.origin : null)) === 'ai';
  const articleMap = {};
  ARTICLES.forEach(a => { articleMap[a.id] = a; });
  const allItems = Object.values(itemMap);

  // ---------- 状態 ----------
  const blank = () => ({
    version: 1, status: {}, checks: {}, focus: {}, suggestion: {},
    habits: [], belongings: [], wishes: [], statusLog: [], practiceLog: [], map: {}, troubleNotes: {},
    goal: '', onboarded: false
  });
  let S = load();
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return Object.assign(blank(), JSON.parse(raw));
    } catch (e) { console.warn(e); }
    return blank();
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
    catch (e) { toast('保存に失敗しました（容量不足の可能性）。写真を減らすかバックアップしてください。'); }
  }

  // ---------- ユーティリティ ----------
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function today() { return ymd(new Date()); }
  function ymd(d) { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
  function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
  function addMonths(s, n) { const d = parseYmd(s); d.setMonth(d.getMonth() + n); return ymd(d); }
  function diffDays(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
  function fmtDate(s) { if (!s) return '—'; const d = parseYmd(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
  function yen(n) { return n || n === 0 ? '¥' + Number(n).toLocaleString('ja-JP') : '—'; }
  function rel(s) {
    if (!s) return '';
    const n = diffDays(today(), s);
    if (n === 0) return '今日';
    if (n === 1) return '明日';
    if (n === -1) return '昨日';
    return n > 0 ? n + '日後' : Math.abs(n) + '日前';
  }

  function statusSet(it) { return D.statusSets[it.kind] || D.statusSets.habit; }
  function statusOf(id) { return S.status[id] || 0; }
  function maxV(it) { const s = statusSet(it); return s[s.length - 1].v; }
  function statusLabel(it) {
    const v = statusOf(it.id);
    const set = statusSet(it);
    let best = set[0];
    set.forEach(o => { if (o.v <= v) best = o; });
    return best.label;
  }
  function progress(it) { return Math.min(1, statusOf(it.id) / maxV(it)); }
  function catProgress(c) {
    const p = c.items.reduce((a, it) => a + progress(it), 0);
    return c.items.length ? p / c.items.length : 0;
  }
  function setStatus(id, v) {
    if (statusOf(id) === v) return;
    S.status[id] = v;
    S.statusLog.push({ id, v, date: today() });
    if (S.statusLog.length > 1000) S.statusLog = S.statusLog.slice(-1000);
    save();
  }
  function raiseStatus(id, v) {
    const it = itemMap[id];
    if (!it) return;
    const allowed = statusSet(it).map(o => o.v).filter(x => x >= v);
    const target = allowed.length ? allowed[0] : maxV(it);
    if (statusOf(id) < target) setStatus(id, target);
  }

  // ---------- 習慣 ----------
  function habitInterval(h) { return Number(h.interval) || D.freqDays[h.freq] || 7; }
  function habitNext(h) { return h.last ? addDays(h.last, habitInterval(h)) : today(); }
  function habitDue(h) { return h.active !== false && habitNext(h) <= today(); }
  function habitDoneToday(h) { return h.last === today(); }
  function addHabit(name, freq, itemId, interval) {
    const exists = S.habits.find(h => h.name === name && h.itemId === itemId && h.active !== false);
    if (exists) return false;
    S.habits.push({ id: uid(), name, freq, interval: interval || D.freqDays[freq], itemId: itemId || null, last: null, log: [], createdAt: today(), active: true });
    return true;
  }
  function doneHabit(h) {
    if (habitDoneToday(h)) { // 取り消し
      h.log = (h.log || []).filter(d => d !== today());
      h.last = h.log.length ? h.log[h.log.length - 1] : null;
    } else {
      h.log = (h.log || []).concat(today()).slice(-400);
      h.last = today();
      if (h.itemId) {
        raiseStatus(h.itemId, 4);
        const streak = h.log.length;
        if (streak >= 8) raiseStatus(h.itemId, 5);
      }
    }
    save();
  }

  // ---------- メンテナンス ----------
  function maintDue(b) { return b.nextMaint && b.nextMaint <= today(); }
  function replaceDate(b) { return b.purchaseDate && b.replaceMonths ? addMonths(b.purchaseDate, Number(b.replaceMonths)) : null; }

  // ---------- おすすめ ----------
  function suggestions() {
    const list = [];
    allItems.forEach(it => {
      if (S.suggestion[it.id]) return;
      const v = statusOf(it.id);
      if (v >= 4) return;
      const c = catMap[it.cat];
      const sg = it.suggest || (S.focus[it.id] ? {
        text: '「' + it.name + '」の観点を確認する',
        reason: '「気にする」に登録した項目です。',
        priority: 2
      } : null);
      if (!sg) return;
      let score = (4 - (sg.priority || 2)) * 10;
      if (c.important) score += 8;
      if (S.focus[it.id]) score += 15;
      if (v === 0) score += 3;
      list.push({ it, sg, score });
    });
    return list.sort((a, b) => b.score - a.score);
  }
  function adopt(id) {
    const it = itemMap[id];
    S.suggestion[id] = 'adopted';
    S.focus[id] = S.focus[id] || 2;
    raiseStatus(id, 2);
    let n = 0;
    (it.tasks || []).forEach(t => { if (addHabit(t.name, t.freq, id, t.interval)) n++; });
    save();
    toast('採用しました' + (n ? '（習慣に' + n + '件追加）' : ''));
  }

  function openSheet(title, bodyHtml, onSubmit) {
    const root = document.getElementById('sheet');
    root.innerHTML = '<div class="sheet-backdrop" data-act="close-sheet"></div>' +

      '<div class="sheet-head"><button type="button" class="link" data-act="close-sheet">キャンセル</button>' +
      '<strong>' + esc(title) + '</strong><button type="submit" class="link strong">保存</button></div>' +
      '<div class="sheet-body">' + bodyHtml + '</div></form>';
    root.classList.add('open');
    document.body.classList.add('noscroll');
    const form = document.getElementById('sheet-form');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(form);
      const data = {};
      fd.forEach((v, k) => { if (!(v instanceof File)) data[k] = String(v).trim(); });
      const ok = await onSubmit(data, form);
      if (ok !== false) { closeSheet(); render(); }
    });
  }
  function closeSheet() {

  // ---------- 部品 ----------

  function header(title, back) {

      field('アイテム名', 'name', b.name, 'text', 'required') +
      select('カテゴリー', 'cat', b.cat || 'その他', cats.map(c => [c, c])) +
      field('購入日', 'purchaseDate', b.purchaseDate, 'date') +
      field('購入金額（円）', 'price', b.price, 'number', 'inputmode="numeric"') +
      select('使用頻度', 'usage', b.usage || '', [['', '—'], ['毎日', '毎日'], ['週数回', '週数回'], ['ときどき', 'ときどき'], ['季節もの', '季節もの']]) +
      select('現在の状態', 'condition', b.condition || '', [['', '—'], ['良好', '良好'], ['使用感あり', '使用感あり'], ['傷みあり', '傷みあり'], ['要買い替え', '要買い替え']]) +
      textarea('手入れ方法', 'care', b.care) +
      field('買い替え目安（か月）', 'replaceMonths', b.replaceMonths, 'number', 'min="1" inputmode="numeric"') +
      field('次回メンテナンス日', 'nextMaint', b.nextMaint, 'date') +
      field('メンテナンス間隔（日）※完了時に次回を自動設定', 'maintInterval', b.maintInterval, 'number', 'min="1" inputmode="numeric"') +
      (b.id ? '<button type="button" class="btn danger full" data-act="del-belonging" data-id="' + b.id + '">この持ち物を削除</button>' : ''),
      async (d, form) => {
        if (!d.name) { toast('アイテム名を入力してください'); return false; }
        const file = form.querySelector('input[name=photo]').files[0];
        let photo = b.photo || null;
        if (d.removePhoto) photo = null;
        if (file) photo = await resizeImage(file, 480);
        const rec = {
          name: d.name, cat: d.cat, purchaseDate: d.purchaseDate || null, price: d.price ? Number(d.price) : null,
          usage: d.usage, condition: d.condition, care: d.care, replaceMonths: d.replaceMonths ? Number(d.replaceMonths) : null,
          nextMaint: d.nextMaint || null, maintInterval: d.maintInterval ? Number(d.maintInterval) : null, photo
        };
        if (b.id) Object.assign(b, rec); else S.belongings.push(Object.assign({ id: uid(), createdAt: today() }, rec));
        save(); toast('保存しました');
      });
  }

  function wishForm(w) {
    w = w || { priority: 2 };
    openSheet(w.id ? '欲しいものを編集' : '欲しいものを追加',
      field('名前', 'name', w.name, 'text', 'required placeholder="例：眉用ハサミ"') +
      select('優先度', 'priority', w.priority || 2, prioOpts) +
      field('予算（円）', 'budget', w.budget, 'number', 'inputmode="numeric"') +
      field('購入予定時期', 'plannedDate', w.plannedDate, 'month') +
      field('購入金額（円）', 'price', w.price, 'number', 'inputmode="numeric"') +
      textarea('メモ（選ぶ条件など）', 'note', w.note) +
      (w.id ? '<button type="button" class="btn danger full" data-act="del-wish" data-id="' + w.id + '">削除</button>' : ''),
      d => {
        if (!d.name) { toast('名前を入力してください'); return false; }
        const rec = { name: d.name, priority: Number(d.priority) || 2, budget: d.budget ? Number(d.budget) : null, plannedDate: d.plannedDate || null, price: d.price ? Number(d.price) : null, note: d.note };
        if (w.id) Object.assign(w, rec); else S.wishes.push(Object.assign({ id: uid(), purchased: false, createdAt: today() }, rec));
        save(); toast('保存しました');
      });
  }

  function resizeImage(file, max) {
    return new Promise(resolve => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  // ---------- バックアップ ----------
  async function exportData() {
    const json = JSON.stringify(Object.assign({ exportedAt: new Date().toISOString() }, S), null, 1);
    const name = 'saiteigen-backup-' + today() + '.json';
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  function importData(file) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const obj = JSON.parse(fr.result);
        if (!obj || typeof obj !== 'object' || !obj.status) throw new Error('形式が違います');
        if (!confirm('現在のデータを、バックアップの内容で置き換えます。よろしいですか？')) return;
        delete obj.exportedAt;
        S = Object.assign(blank(), obj);
        save(); render(); toast('復元しました');
      } catch (e) { toast('読み込めませんでした：' + e.message); }
    };
    fr.readAsText(file);
  }

  // ---------- イベント ----------
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'INPUT') return;
    const act = el.dataset.act;
    const id = el.dataset.id;
    const H = () => S.habits.find(h => h.id === id);
    const B = () => S.belongings.find(b => b.id === id);
    const W = () => S.wishes.find(w => w.id === id);
    switch (act) {
      case 'close-sheet': closeSheet(); return;
      case 'card-state': setCard(id, el.dataset.v); toast(STATE_UI[el.dataset.v][1] + ' にしました'); render(); return;
      case 'card-habit': if (addCardHabit(cardMap[id])) toast('習慣に追加しました。今日のタスクに出ます'); render(); return;
      case 'diag': setCard(id, el.dataset.v); S.diagHist = (S.diagHist || []).concat(id).slice(-100); save(); render(); return;
      case 'diag-back': { const last = (S.diagHist || []).pop(); if (last) delete S.map[last]; save(); render(); return; }
      case 'diag-reset': if (confirm('診断の答えをすべて消してやり直しますか？')) { S.map = {}; S.diagHist = []; save(); location.hash = '#/diag'; } return;
      case 'onboarded': S.onboarded = true; break;
      case 'status': setStatus(id, Number(el.dataset.v)); S.onboarded = true; break;
      case 'check': {
        const arr = S.checks[id] = S.checks[id] || [];
        const i = Number(el.dataset.i);
        arr[i] = !arr[i];
        if (arr[i]) raiseStatus(id, 1);
        break;
      }
      case 'focus': S.focus[id] = S.focus[id] ? (S.focus[id] % 3) + 1 : 1; break;
      case 'focus-off': delete S.focus[id]; break;
      case 'adopt': adopt(id); render(); return;
      case 'dismiss': S.suggestion[id] = 'dismissed'; toast('「今はしない」にしました'); break;
      case 'undecide': delete S.suggestion[id]; break;
      case 'habit-done': { const h = H(); if (h) { doneHabit(h); if (habitDoneToday(h)) toast('おつかれさまです'); } render(); return; }
      case 'add-tpl': {
        const t = itemMap[id].tasks[Number(el.dataset.i)];
        addHabit(t.name, t.freq, id, t.interval); raiseStatus(id, 3); toast('習慣に追加しました'); break;
      }
      case 'new-habit': habitForm(null, id); return;
      case 'edit-habit': habitForm(H()); return;
      case 'del-habit': if (confirm('この習慣を削除しますか？')) { S.habits = S.habits.filter(h => h.id !== id); save(); closeSheet(); render(); } return;
      case 'practice': {
        const note = prompt('実践したことのメモ（任意）', '');
        if (note === null) return;
        S.practiceLog.push({ id, date: today(), note });
        raiseStatus(id, 4); toast('記録しました'); break;
      }
      case 'new-belonging': belongingForm(); return;
      case 'edit-belonging': belongingForm(B()); return;
      case 'del-belonging': if (confirm('削除しますか？')) { S.belongings = S.belongings.filter(b => b.id !== id); save(); closeSheet(); render(); } return;
      case 'maint-done': {
        const b = B(); if (!b) return;
        b.lastMaint = today();
        b.nextMaint = b.maintInterval ? addDays(today(), b.maintInterval) : null;
        toast(b.nextMaint ? '次回は ' + fmtDate(b.nextMaint) : '手入れを記録しました'); break;
      }
      case 'to-wish': {
        const b = B(); if (!b) return;
        S.wishes.push({ id: uid(), name: b.name + '（買い替え）', priority: 2, budget: b.price || null, replace: true, purchased: false, createdAt: today() });
        toast('欲しいものに追加しました'); break;
      }
      case 'new-wish': wishForm(); return;
      case 'edit-wish': wishForm(W()); return;
      case 'del-wish': if (confirm('削除しますか？')) { S.wishes = S.wishes.filter(w => w.id !== id); save(); closeSheet(); render(); } return;
      case 'wish-bought': {
        const w = W(); if (!w) return;
        w.purchased = !w.purchased;
        w.purchasedAt = w.purchased ? today() : null;
        if (w.purchased) {
          save();
          if (confirm('購入済みにしました。持ち物にも登録しますか？')) {
            S.belongings.push({ id: uid(), name: w.name.replace('（買い替え）', ''), cat: 'その他', purchaseDate: today(), price: w.price || w.budget || null, createdAt: today() });
            toast('持ち物に登録しました');
          }
        }
        break;
      }
      case 'edit-goal': {
        openSheet('目標', textarea('どうなりたいか', 'goal', S.goal), d => { S.goal = d.goal; save(); });
        return;
      }
      case 'export': exportData(); return;
      case 'reset':
        if (confirm('すべての記録を消去します。元に戻せません。よろしいですか？') && confirm('本当に消去しますか？')) { S = blank(); save(); location.hash = '#/home'; toast('消去しました'); }
        render(); return;
      default: return;
    }
    save(); render();
  });
  let memoTimer;
  document.addEventListener('input', e => {
    const id = e.target.dataset && e.target.dataset.memo;
    if (!id) return;
    S.troubleNotes = S.troubleNotes || {};
    const v = e.target.value;
    if (v.trim()) S.troubleNotes[id] = v; else delete S.troubleNotes[id];
    clearTimeout(memoTimer);
    memoTimer = setTimeout(save, 400);
  });
  document.addEventListener('change', e => {
    if (e.target.dataset && e.target.dataset.act === 'import' && e.target.files[0]) importData(e.target.files[0]);
  });
  document.addEventListener('submit', e => {
    if (e.target.hasAttribute('data-search')) {
      e.preventDefault();
      const q = e.target.q.value;
      location.hash = '#/learn' + (q ? '?q=' + encodeURIComponent(q) : '');
    }
  });

  // ---------- ルーター ----------
  let lastRoute = '';
  function render() {
    const hash = location.hash || '#/map';
    const [path, query] = hash.slice(2).split('?');
    const [name, arg, arg2] = path.split('/');
    const params = new URLSearchParams(query || '');
    const fn = views[name] || views.map;
    const y = window.scrollY;
    $app.innerHTML = fn(name === 'learn' ? params.get('q') : (name === 'map' || name === 'ng' || name === 'mapng') ? params.get('a') : arg, arg2);
    const tab = { mapng: 'map', scene: 'scene', s: 'scene', judge: 'scene', guide: 'scene', sos: 'scene', trouble: 'scene', ng: 'scene', map: 'map', card: 'map', diag: 'map', 'diag-result': 'map', home: 'home', suggest: 'home', learn: 'map', articles: 'map', cat: 'map', item: 'map', article: 'map',
      habits: 'home', belongings: 'own', maint: 'own', wish: 'own', my: 'my', status: 'my', about: 'my' }[name] || 'map';
    document.querySelectorAll('.tabbar a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
    if (hash !== lastRoute) window.scrollTo(0, 0); else window.scrollTo(0, y);
    lastRoute = hash;
  }
  window.addEventListener('hashchange', render);
  render();

  // 日付が変わったら再描画（ホーム画面アプリを開きっぱなしにした場合）
  let renderedDay = today();
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && today() !== renderedDay) { renderedDay = today(); render(); }
  });

  // 保存できない環境（ファイルから開いた場合など）では最初に知らせる
  try { localStorage.setItem('saiteigen.test', '1'); localStorage.removeItem('saiteigen.test'); }
  catch (e) { setTimeout(() => toast('この開き方では記録を保存できません。Safariで開くか、バックアップを使ってください。'), 600); }

  // ---------- オフライン対応 ----------
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
})();

</script>
</body>
</html>
